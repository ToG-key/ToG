<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToG Key - Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0 }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            font-family: system-ui, sans-serif;
            color: #e8e6e1;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #161b25;
            border: 1px solid #232a38;
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h1 { font-size: 20px; }
        h1 span { color: #f2b33d; }
        p { font-size: 14px; color: #8a93a3; line-height: 1.5; }
        .key-box {
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            color: #f2b33d;
            background: rgba(255,255,255,0.03);
            border: 1px solid #232a38;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            word-break: break-all;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(155deg, #f2b33d, #d99418);
            color: #1a1206;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a2029;
            border: 1px solid #232a38;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="card">
        <h1>ToG<span> Key</span> (Test)</h1>
        <p id="desc">Bấm nút để tạo key test, sau đó qua Link4m để nhận.</p>
        <div class="key-box" id="keyBox">Chưa có key</div>
        <button id="getKeyBtn">🔑 Tạo Key</button>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        // ===== CẤU HÌNH LINK4M =====
        const LINK4M_API = '6a954eb5b9ba5176de7851ed';
        const LINK4M_BASE = 'https://link4m.co/st';

        // ===== DOM =====
        const keyBox = document.getElementById('keyBox');
        const getKeyBtn = document.getElementById('getKeyBtn');
        const desc = document.getElementById('desc');
        const toastEl = document.getElementById('toast');

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
        }

        // ===== TẠO KEY TEST (client-side) =====
        function generateKey() {
            const rand = () => Math.floor(Math.random() * 16).toString(16);
            let s = '';
            for (let i = 0; i < 16; i++) s += rand();
            return 'ToG-' + s.toUpperCase();
        }

        // ===== BẤM NÚT: tạo key → lồng Link4m → quay về kèm ?key= =====
        getKeyBtn.addEventListener('click', () => {
            const key = generateKey();

            // URL quay về trang này kèm key
            const backUrl = location.origin + location.pathname + '?key=' + encodeURIComponent(key);

            // Bọc qua Link4m
            const wrapped = `${LINK4M_BASE}?api=${LINK4M_API}&url=${encodeURIComponent(backUrl)}`;

            location.href = wrapped;
        });

        // ===== QUAY VỀ TỪ LINK4M: hiển thị key =====
        (function init() {
            const key = new URLSearchParams(location.search).get('key');
            if (!key || !key.startsWith('ToG-')) return;

            // Xóa ?key= khỏi URL cho gọn
            history.replaceState(null, '', location.pathname);

            keyBox.textContent = key;
            desc.textContent = 'Key test của bạn đã sẵn sàng. Nhấn để sao chép.';
            keyBox.style.cursor = 'pointer';
            keyBox.onclick = () => {
                navigator.clipboard.writeText(key);
                showToast('📋 Đã sao chép key!');
            };
            getKeyBtn.textContent = '📋 Sao chép key';
            getKeyBtn.onclick = () => {
                navigator.clipboard.writeText(key);
                showToast('📋 Đã sao chép key!');
            };
        })();
    </script>
</body>
</html>
