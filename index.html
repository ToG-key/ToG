<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToG Key V2</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #0b0e14;
            --panel: #161b25;
            --line: #232a38;
            --gold: #f2b33d;
            --gold-2: #d99418;
            --teal: #2dd4bf;
            --text: #e8e6e1;
            --muted: #8a93a3;
            --danger: #e5484d
        }
        * { box-sizing: border-box; margin: 0; padding: 0 }
        html, body { height: 100% }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(1200px 600px at 20% -10%, rgba(242, 179, 61, 0.08), transparent 60%),
                radial-gradient(1000px 500px at 90% 110%, rgba(45, 212, 191, 0.07), transparent 60%),
                var(--bg-0);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            padding: 32px 16px
        }
        .dropdown-wrapper { width: 100%; max-width: 520px; position: relative }
        .dropdown-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            cursor: pointer;
            transition: border-color .2s, box-shadow .2s;
            user-select: none
        }
        .dropdown-header:hover {
            border-color: #3a4557;
            box-shadow: 0 0 30px rgba(242, 179, 61, 0.04)
        }
        .dropdown-header-left { display: flex; align-items: center; gap: 14px }
        .dropdown-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: linear-gradient(155deg, var(--gold), var(--gold-2));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(242, 179, 61, 0.25); flex-shrink: 0
        }
        .dropdown-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 16px; letter-spacing: 0.02em
        }
        .dropdown-title span { color: var(--gold) }
        .dropdown-sub { font-size: 12px; color: var(--muted); margin-top: 2px }
        .dropdown-arrow {
            font-size: 20px; color: var(--muted);
            transition: transform .3s ease; line-height: 1
        }
        .dropdown-header.open .dropdown-arrow { transform: rotate(180deg) }
        .dropdown-body {
            margin-top: 12px; max-height: 0; overflow: hidden;
            transition: max-height .4s cubic-bezier(0.4, 0, 0.2, 1), opacity .3s ease, margin .3s ease;
            opacity: 0; pointer-events: none
        }
        .dropdown-body.open { max-height: 700px; opacity: 1; pointer-events: auto }
        .dropdown-body-inner {
            background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; padding: 22px;
            display: flex; flex-direction: column; gap: 18px
        }
        .keycard-mini {
            position: relative; width: 100%; border-radius: 16px;
            background: linear-gradient(155deg, #1c222e 0%, #12161f 55%, #0d1017 100%);
            border: 1px solid var(--line);
            box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            padding: 20px 24px 18px;
            display: flex; flex-direction: column; gap: 14px; overflow: hidden
        }
        .keycard-mini-top {
            display: flex; align-items: flex-start; justify-content: space-between;
            position: relative; z-index: 1
        }
        .keycard-mini-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 17px; letter-spacing: 0.02em; color: var(--text)
        }
        .keycard-mini-tag span { color: var(--gold) }
        .keycard-mini-sub {
            font-size: 10px; color: var(--muted);
            letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px
        }
        .chip-mini {
            width: 42px; height: 42px; border-radius: 10px;
            background: linear-gradient(145deg, #1a1f2a, #0d1117);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            flex-shrink: 0; position: relative;
            display: flex; align-items: center; justify-content: center;
            padding: 4px; border: 1px solid rgba(255, 255, 255, 0.06); overflow: hidden;
        }
        .chip-logo {
            width: 100%; height: 100%; object-fit: contain;
            border-radius: 6px; display: block;
        }
        .keycard-mini-mid {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 48px; width: 100%
        }
        .empty-key-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px; color: var(--muted);
            letter-spacing: 0.1em; opacity: 0.4
        }
        .keycard-mini-bottom {
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 1
        }
        .status-pill-mini {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--muted); padding: 4px 10px;
            border: 1px solid var(--line); border-radius: 999px;
            background: rgba(255, 255, 255, 0.02)
        }
        .status-pill-mini .led {
            width: 5px; height: 5px; border-radius: 50%; background: var(--muted)
        }
        .status-pill-mini.ready .led { background: var(--teal); box-shadow: 0 0 8px var(--teal) }
        .status-pill-mini.locked .led { background: var(--gold); box-shadow: 0 0 8px var(--gold) }
        .panel-mini { display: flex; flex-direction: column; gap: 12px }
        .panel-mini-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px; font-weight: 600; color: var(--text)
        }
        .panel-mini-desc { font-size: 13px; color: var(--muted); line-height: 1.5 }
        .btn {
            appearance: none; border: none; cursor: pointer;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
            padding: 12px 18px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease
        }
        .btn:active { transform: scale(0.98) }
        .btn-primary {
            background: linear-gradient(155deg, var(--gold), var(--gold-2));
            color: #1a1206;
            box-shadow: 0 8px 20px -6px rgba(242, 179, 61, 0.4)
        }
        .btn-primary:hover { box-shadow: 0 12px 28px -6px rgba(242, 179, 61, 0.5) }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none }
        .btn-ghost {
            background: transparent; border: 1px solid var(--line); color: var(--text)
        }
        .btn-ghost:hover { border-color: #37414f; background: rgba(255, 255, 255, 0.02) }
        .row-mini { display: flex; gap: 10px }
        .row-mini .btn { flex: 1 }
        .spinner {
            width: 16px; height: 16px; border-radius: 50%;
            border: 2px solid rgba(26, 18, 6, 0.35); border-top-color: #1a1206;
            animation: spin .7s linear infinite; display: none
        }
        .btn.loading .spinner { display: inline-block }
        .btn.loading .btn-label { display: none }
        @keyframes spin { to { transform: rotate(360deg) } }
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a2029; border: 1px solid var(--line); color: var(--text);
            padding: 11px 18px; border-radius: 10px; font-size: 13px;
            opacity: 0; pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); z-index: 20
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }
        @media (max-width:480px) {
            .dropdown-header { padding: 14px 16px }
            .dropdown-body-inner { padding: 16px }
            .keycard-mini { padding: 16px 18px 14px }
        }
    </style>
</head>
<body>
    <div class="dropdown-wrapper">
        <div class="dropdown-header" id="dropdownHeader">
            <div class="dropdown-header-left">
                <div class="dropdown-icon">
                    <img src="tog.png" alt="ToG Key" style="width:36px;height:36px;object-fit:contain;border-radius:8px">
                </div>
                <div>
                    <div class="dropdown-title">ToG<span> Key</span></div>
                    <div class="dropdown-sub">Mã truy cập ToG</div>
                </div>
            </div>
            <div class="dropdown-arrow">▾</div>
        </div>
        <div class="dropdown-body" id="dropdownBody">
            <div class="dropdown-body-inner">
                <div class="keycard-mini">
                    <div class="keycard-mini-top">
                        <div>
                            <div class="keycard-mini-tag">ToG<span> Key</span></div>
                            <div class="keycard-mini-sub">Mã truy cập ToG</div>
                        </div>
                        <div class="chip-mini">
                            <img src="logo.png" alt="ToG Logo" class="chip-logo">
                        </div>
                    </div>
                    <div class="keycard-mini-mid" id="keycardMid">
                        <span class="empty-key-text">Chưa có key</span>
                    </div>
                    <div class="keycard-mini-bottom">
                        <div class="status-pill-mini locked" id="statusPill">
                            <span class="led"></span>
                            <span id="statusText">Chưa mở khóa</span>
                        </div>
                    </div>
                </div>
                <div class="panel-mini" id="panelIdle">
                    <div class="panel-mini-title">Nhận Key ToG:</div>
                    <button class="btn btn-primary" id="getKeyBtn">
                        <span class="spinner"></span>
                        <span class="btn-label">🔑 Lấy Key</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const LINK4M_API = "6a954eb5b9ba5176de7851ed";
        const LINK4M_BASE = "https://link4m.co/st";
        const CRYPTO_URL = 'https://baovemahoa202020202020.vercel.app/api/cryp';

        const header = document.getElementById('dropdownHeader');
        const body = document.getElementById('dropdownBody');
        const getKeyBtn = document.getElementById('getKeyBtn');
        const panelIdle = document.getElementById('panelIdle');
        const keycardMid = document.getElementById('keycardMid');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const toastEl = document.getElementById('toast');
        let isOpen = false;

        header.addEventListener('click', () => {
            isOpen = !isOpen;
            header.classList.toggle('open', isOpen);
            body.classList.toggle('open', isOpen);
        });

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
        }

        function makeHash8() {
            return Math.floor(10000000 + Math.random() * 90000000).toString();
        }

        function renderUnlockedKey(key) {
            keycardMid.innerHTML = `
                <div style="width:100%; padding: 4px 0;">
                    <div style="text-align: center; margin-bottom: 8px;">
                        <div style="font-size: 22px; font-weight: 700; color: var(--text);">Key của bạn</div>
                    </div>
                    <div style="text-align: center; margin-bottom: 16px;">
                        <span style="display: inline-block; font-size: 13px; font-weight: 700; color: var(--teal); background: rgba(45,212,191,0.1); padding: 4px 16px; border-radius: 20px; border: 1px solid rgba(45,212,191,0.2);">✅ HỢP LỆ</span>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <div style="font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">KEY KÍCH HOẠT</div>
                        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px;">
                            <span id="keyDisplay" style="flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--gold); font-weight: 700; letter-spacing: 1px;">${key}</span>
                            <button id="copyKeyBtnSmall" style="background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 8px;" title="Sao chép key">📋</button>
                        </div>
                    </div>
                    <button id="copyKeyBtn" style="width: 100%; padding: 14px; background: linear-gradient(155deg, var(--gold), var(--gold-2)); border: none; border-radius: 10px; color: #1a1206; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">📋 Sao chép key</button>
                </div>
            `;
            document.getElementById('copyKeyBtnSmall').addEventListener('click', function() {
                navigator.clipboard.writeText(document.getElementById('keyDisplay').textContent);
                showToast('📋 Đã sao chép key!');
            });
            document.getElementById('keyDisplay').addEventListener('click', function() {
                navigator.clipboard.writeText(this.textContent);
                showToast('📋 Đã sao chép key!');
            });
            document.getElementById('copyKeyBtn').addEventListener('click', function() {
                navigator.clipboard.writeText(document.getElementById('keyDisplay').textContent);
                showToast('📋 Đã sao chép key!');
            });
            statusPill.classList.remove('locked');
            statusPill.classList.add('ready');
            statusText.textContent = 'Đã mở khóa';
            panelIdle.style.display = 'none';
        }

        function resetCard() {
            keycardMid.innerHTML = `<span class="empty-key-text">Chưa có key</span>`;
            statusPill.classList.remove('ready');
            statusPill.classList.add('locked');
            statusText.textContent = 'Chưa mở khóa';
            panelIdle.style.display = 'flex';
        }

        async function callCryptoServer(action, payload = {}) {
            const response = await fetch(CRYPTO_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: action,
                    payload: payload
                })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Crypto Server Error');
            }
            return data;
        }

        async function createKeyOnBackend(sigCode) {
            try {
                const data = await callCryptoServer('create_key', { sigCode: sigCode });
                if (!data || !data.key) {
                    throw new Error('Invalid response');
                }
                return data;
            } catch (error) {
                console.error('❌ Create key error:', error.message);
                showToast('❌ ' + error.message);
                return { success: false, error: error.message };
            }
        }

        async function checkKeyStatus(key) {
            try {
                const data = await callCryptoServer('check_status', { key: key });
                return data;
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        function goThroughLink4m(key) {
            const destination = window.location.origin + window.location.pathname + '?key=' + encodeURIComponent(key);
            const wrapped = `${LINK4M_BASE}?api=${LINK4M_API}&url=${encodeURIComponent(destination)}`;
            window.location.replace(wrapped);
        }

        getKeyBtn.addEventListener('click', async () => {
            getKeyBtn.classList.add('loading');
            getKeyBtn.disabled = true;
            try {
                const sigCode = makeHash8();
                const data = await createKeyOnBackend(sigCode);
                if (!data.success || !data.key) {
                    throw new Error(data.error || 'Không tạo được key');
                }
                goThroughLink4m(data.key);
            } catch (error) {
                showToast('❌ Lỗi: ' + error.message);
                getKeyBtn.classList.remove('loading');
                getKeyBtn.disabled = false;
            }
        });

        (function displayKeyFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const key = urlParams.get('key');
            if (!key || !key.startsWith('ToG-')) {
                return;
            }
            keycardMid.innerHTML = `
                <div style="text-align:center;padding:20px;">
                    <div style="display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top:3px solid var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                    <div style="margin-top:10px;color:var(--muted);font-size:13px;">Đang xác minh key...</div>
                </div>
            `;
            checkKeyStatus(key)
                .then(data => {
                    if (data.success && (data.status === 'verified' || data.status === 'pending')) {
                        renderUnlockedKey(key);
                        showToast('🎉 Key đã được mở khóa!');
                        document.getElementById('dropdownHeader').classList.add('open');
                        document.getElementById('dropdownBody').classList.add('open');
                    } else {
                        showToast('⚠️ Key không hợp lệ');
                        resetCard();
                    }
                })
                .catch(error => {
                    console.error('❌ Lỗi kiểm tra key:', error);
                    showToast('❌ Lỗi kết nối server. Vui lòng thử lại.');
                    resetCard();
                });
        })();
    </script>
</body>
</html>
